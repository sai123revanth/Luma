<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LUMA Retail POS | Prism Checkout</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #000000;
            --accent-1: #8b5cf6; /* Violet */
            --accent-2: #ec4899; /* Pink */
            --accent-3: #22d3ee; /* Cyan */
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.12);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: #ffffff;
            overflow-x: hidden;
            letter-spacing: -0.01em;
            margin: 0;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        /* Fixed Background System */
        .bg-fixed-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background: var(--bg);
        }

        .grid-bg {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 30px 30px;
            mask-image: radial-gradient(circle at center, black, transparent 90%);
        }

        .aura {
            position: absolute;
            width: 100vw;
            height: 100vw;
            max-width: 600px;
            max-height: 600px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.2; 
            pointer-events: none;
            will-change: transform;
            animation: pulse-aura 12s infinite alternate ease-in-out;
        }
        .aura-1 { background: var(--accent-1); top: -10%; right: -10%; }
        .aura-2 { background: var(--accent-2); bottom: -10%; left: -10%; animation-delay: -4s; }

        @keyframes pulse-aura {
            0% { transform: scale(1) translate(0, 0); opacity: 0.15; }
            100% { transform: scale(1.1) translate(20px, 20px); opacity: 0.25; }
        }

        .glass-panel {
            background: rgba(15, 15, 15, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
        }

        .border-beam {
            position: relative;
            z-index: 1;
        }
        
        .border-beam::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1.5px;
            background: conic-gradient(from 0deg, transparent 60%, var(--accent-1), var(--accent-2), var(--accent-3), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            animation: spin-beam 5s linear infinite;
            pointer-events: none;
        }

        @keyframes spin-beam {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .gradient-brand {
            background: linear-gradient(to right, #ffffff, #8b5cf6, #ec4899, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 5s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .product-card:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.1);
        }

        @media (min-width: 1024px) {
            .product-card:hover {
                transform: translateY(-6px);
                border-color: rgba(139, 92, 246, 0.4);
            }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .reveal {
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .category-btn.active {
            background: rgba(139, 92, 246, 0.15);
            color: #a78bfa;
            border-color: rgba(139, 92, 246, 0.4);
        }

        @media (max-width: 640px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
            }
            .hero-text { font-size: 1.75rem; }
        }
    </style>
</head>
<body>
    <div class="bg-fixed-container">
        <div class="grid-bg"></div>
        <div class="aura aura-1"></div>
        <div class="aura aura-2"></div>
    </div>

    <div class="relative z-10 flex flex-col min-h-screen">
        <!-- Navigation -->
        <header class="p-4 md:px-12 flex justify-between items-center w-full sticky top-0 z-[100] glass-panel border-0 border-b">
            <div class="flex items-center gap-3">
                <a href="index.html" class="w-8 h-8 md:w-10 md:h-10 border-beam rounded-lg md:rounded-xl glass-panel flex items-center justify-center">
                    <div class="w-2 h-2 md:w-2.5 md:h-2.5 bg-white rounded-full shadow-[0_0_8px_#fff]"></div>
                </a>
                <div>
                    <h1 class="text-[10px] md:text-xs font-bold uppercase tracking-[0.2em]">LUMA Retail</h1>
                    <span class="text-[7px] md:text-[8px] text-violet-400 font-bold uppercase tracking-tighter">Mohan Enterprises Pulivendula</span>
                </div>
            </div>
            <div class="flex items-center gap-3 md:gap-6">
            </div>
        </header>

        <main class="flex-1 flex flex-col lg:flex-row gap-4 md:gap-6 p-4 md:p-12 pt-4">
            <!-- Left Pane: Product Catalog -->
            <div class="flex-[1.8] flex flex-col gap-4 md:gap-6">
                <div class="reveal active flex flex-col gap-3">
                    <h2 class="hero-text text-2xl md:text-5xl font-black tracking-tighter uppercase leading-tight">Retail <span class="gradient-brand">Market</span></h2>
                    
                    <div class="glass-panel p-1 rounded-xl flex items-center gap-2 border-white/5 w-full transition-all focus-within:border-violet-500/50">
                        <i data-lucide="search" class="ml-3 w-4 h-4 text-violet-400"></i>
                        <input type="text" placeholder="Search products..." class="bg-transparent w-full py-2 text-xs focus:outline-none text-white uppercase tracking-widest placeholder:text-slate-700">
                    </div>
                </div>

                <!-- Categories -->
                <div class="reveal active flex gap-2 overflow-x-auto pb-1 custom-scrollbar -mx-1 px-1">
                    <button class="category-btn active px-4 py-2 rounded-lg glass-panel text-[8px] md:text-[10px] font-bold uppercase tracking-widest whitespace-nowrap transition-all border-white/10">All</button>
                    <button class="category-btn px-4 py-2 rounded-lg glass-panel text-[8px] md:text-[10px] font-bold uppercase tracking-widest whitespace-nowrap transition-all border-white/5 text-slate-500">Tech</button>
                    <button class="category-btn px-4 py-2 rounded-lg glass-panel text-[8px] md:text-[10px] font-bold uppercase tracking-widest whitespace-nowrap transition-all border-white/5 text-slate-500">Style</button>
                    <button class="category-btn px-4 py-2 rounded-lg glass-panel text-[8px] md:text-[10px] font-bold uppercase tracking-widest whitespace-nowrap transition-all border-white/5 text-slate-500">Food</button>
                </div>

                <!-- Product Grid -->
                <div class="product-grid grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3 md:gap-4 overflow-y-auto max-h-[40vh] md:max-h-[60vh] pr-1 custom-scrollbar">
                    <div class="reveal active product-card glass-panel p-3 md:p-5 rounded-2xl md:rounded-[2rem] transition-all cursor-pointer group" onclick="addToCart('Watch Pro', 24999.00)">
                        <div class="aspect-square rounded-xl md:rounded-2xl bg-white/[0.02] mb-3 flex items-center justify-center border border-white/5">
                            <i data-lucide="watch" class="w-8 h-8 text-violet-400 opacity-60"></i>
                        </div>
                        <h3 class="text-[10px] md:text-xs font-bold uppercase tracking-tight mb-1 truncate">Watch Pro</h3>
                        <div class="flex justify-between items-center">
                            <span class="text-xs md:text-sm font-black text-violet-400">₹24,999</span>
                            <span class="text-[7px] text-slate-600 font-bold uppercase">#12</span>
                        </div>
                    </div>

                    <div class="reveal active product-card glass-panel p-3 md:p-5 rounded-2xl md:rounded-[2rem] transition-all cursor-pointer group" onclick="addToCart('Audio X', 12450.50)">
                        <div class="aspect-square rounded-xl md:rounded-2xl bg-white/[0.02] mb-3 flex items-center justify-center border border-white/5">
                            <i data-lucide="headphones" class="w-8 h-8 text-pink-400 opacity-60"></i>
                        </div>
                        <h3 class="text-[10px] md:text-xs font-bold uppercase tracking-tight mb-1 truncate">Audio X</h3>
                        <div class="flex justify-between items-center">
                            <span class="text-xs md:text-sm font-black text-pink-400">₹12,450</span>
                            <span class="text-[7px] text-slate-600 font-bold uppercase">#08</span>
                        </div>
                    </div>

                    <div class="reveal active product-card glass-panel p-3 md:p-5 rounded-2xl md:rounded-[2rem] transition-all cursor-pointer group" onclick="addToCart('Organic Coffee', 1450.00)">
                        <div class="aspect-square rounded-xl md:rounded-2xl bg-white/[0.02] mb-3 flex items-center justify-center border border-white/5">
                            <i data-lucide="coffee" class="w-8 h-8 text-cyan-400 opacity-60"></i>
                        </div>
                        <h3 class="text-[10px] md:text-xs font-bold uppercase tracking-tight mb-1 truncate">Coffee</h3>
                        <div class="flex justify-between items-center">
                            <span class="text-xs md:text-sm font-black text-cyan-400">₹1,450</span>
                            <span class="text-[7px] text-slate-600 font-bold uppercase">#45</span>
                        </div>
                    </div>

                    <div class="reveal active product-card glass-panel p-3 md:p-5 rounded-2xl md:rounded-[2rem] transition-all cursor-pointer group" onclick="addToCart('Sneakers', 9999.00)">
                        <div class="aspect-square rounded-xl md:rounded-2xl bg-white/[0.02] mb-3 flex items-center justify-center border border-white/5">
                            <i data-lucide="footprints" class="w-8 h-8 text-violet-400 opacity-60"></i>
                        </div>
                        <h3 class="text-[10px] md:text-xs font-bold uppercase tracking-tight mb-1 truncate">Sneakers</h3>
                        <div class="flex justify-between items-center">
                            <span class="text-xs md:text-sm font-black text-violet-400">₹9,999</span>
                            <span class="text-[7px] text-slate-600 font-bold uppercase">#05</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Pane: Active Cart -->
            <div class="flex-1 flex flex-col gap-4 md:gap-6 min-h-[400px]">
                <div class="glass-panel border-beam rounded-[2rem] md:rounded-[2.5rem] flex-1 flex flex-col overflow-hidden relative shadow-2xl">
                    <!-- Cart Header -->
                    <div class="p-4 md:p-6 border-b border-white/10 flex justify-between items-center bg-white/[0.02]">
                        <h3 class="text-xs font-bold uppercase tracking-widest">Active <span class="text-violet-400">Order</span></h3>
                        <button onclick="clearCart()" class="text-[8px] font-bold uppercase tracking-widest text-slate-600 hover:text-red-400 transition-colors">Clear</button>
                    </div>

                    <!-- Items List -->
                    <div id="cart-container" class="flex-1 p-4 md:p-6 overflow-y-auto custom-scrollbar flex flex-col gap-3">
                        <div id="empty-cart" class="h-full flex flex-col items-center justify-center text-center opacity-20 py-10">
                            <i data-lucide="shopping-bag" class="w-12 h-12 mb-3"></i>
                            <p class="text-[9px] font-bold uppercase tracking-[0.2em]">Cart Empty</p>
                        </div>
                    </div>

                    <!-- Totals -->
                    <div class="p-4 md:p-6 bg-white/[0.04] border-t border-white/10 space-y-4">
                        <div class="space-y-1">
                            <div class="flex justify-between text-[8px] font-bold uppercase tracking-widest text-slate-500">
                                <span>Subtotal</span>
                                <span id="subtotal-val">₹0.00</span>
                            </div>
                            <div class="flex justify-between items-end pt-1">
                                <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-white">Total</span>
                                <span id="total-val" class="text-2xl md:text-4xl font-black tracking-tighter text-violet-400">₹0.00</span>
                            </div>
                        </div>

                        <button class="w-full py-4 bg-white text-black font-black text-[10px] uppercase tracking-[0.3em] rounded-xl hover:scale-[1.02] active:scale-[0.98] transition-all shadow-[0_10px_30px_rgba(139,92,246,0.3)]">
                            Checkout
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        let cart = [];

        function addToCart(name, price) {
            const existing = cart.find(item => item.name === name);
            if(existing) {
                existing.qty++;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            renderCart();
        }

        function updateQty(index, delta) {
            cart[index].qty += delta;
            if(cart[index].qty <= 0) cart.splice(index, 1);
            renderCart();
        }

        function clearCart() {
            cart = [];
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-container');
            const subtotalEl = document.getElementById('subtotal-val');
            const totalEl = document.getElementById('total-val');

            if(cart.length === 0) {
                container.innerHTML = `<div id="empty-cart" class="h-full flex flex-col items-center justify-center text-center opacity-20 py-10">
                            <i data-lucide="shopping-bag" class="w-12 h-12 mb-3"></i>
                            <p class="text-[9px] font-bold uppercase tracking-[0.2em]">Cart Empty</p>
                        </div>`;
                subtotalEl.textContent = '₹0.00';
                totalEl.textContent = '₹0.00';
                lucide.createIcons();
                return;
            }

            container.innerHTML = cart.map((item, idx) => `
                <div class="flex items-center gap-3 animate-in slide-in-from-right-2 duration-200">
                    <div class="flex-1">
                        <h4 class="text-[9px] font-bold uppercase tracking-widest text-white truncate">${item.name}</h4>
                        <span class="text-[7px] text-violet-500 font-bold uppercase">₹${item.price.toLocaleString('en-IN')}</span>
                    </div>
                    <div class="flex items-center gap-2 glass-panel px-2 py-1 rounded-lg border-white/5 bg-white/[0.02]">
                        <button onclick="updateQty(${idx}, -1)" class="text-slate-600"><i data-lucide="minus" class="w-2.5 h-2.5"></i></button>
                        <span class="text-[9px] font-black w-3 text-center">${item.qty}</span>
                        <button onclick="updateQty(${idx}, 1)" class="text-slate-600"><i data-lucide="plus" class="w-2.5 h-2.5"></i></button>
                    </div>
                    <div class="text-right min-w-[50px]">
                        <span class="text-[10px] font-black text-white">₹${(item.price * item.qty).toLocaleString('en-IN', {minimumFractionDigits: 2})}</span>
                    </div>
                </div>
            `).join('');

            const subtotal = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);
            const tax = subtotal * 0.085;
            const total = subtotal + tax;

            subtotalEl.textContent = `₹${subtotal.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
            totalEl.textContent = `₹${total.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
            lucide.createIcons();
        }

        const auras = document.querySelectorAll('.aura');
        let mouseX = 0, mouseY = 0, auraX = 0, auraY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 40;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 40;
        });

        function animateAuras() {
            auraX += (mouseX - auraX) * 0.05;
            auraY += (mouseY - auraY) * 0.05;
            auras.forEach((aura, idx) => {
                aura.style.transform = `translate(${auraX * (idx + 1) * 0.5}px, ${auraY * (idx + 1) * 0.5}px)`;
            });
            requestAnimationFrame(animateAuras);
        }
        animateAuras();
    </script>
</body>
</html>
