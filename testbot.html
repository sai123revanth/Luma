<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Tech AI</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Markdown Parser (Marked.js) for rendering code blocks nicely -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        primary: '#6366f1', // Indigo 500
                        secondary: '#0f172a', // Slate 900
                        accent: '#22d3ee', // Cyan 400
                        dark: '#020617', // Slate 950
                        surface: '#1e293b', // Slate 800
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(10px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5); 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }

        /* Glassmorphism Utilities */
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glass-header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Message Bubbles */
        .msg-user {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        }
        
        .msg-bot {
            background: #1e293b;
            border: 1px solid #334155;
        }

        /* Markdown Styles within Bot Messages */
        .prose pre {
            background-color: #0f172a !important;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            border: 1px solid #334155;
            overflow-x: auto;
        }
        .prose code {
            font-family: 'JetBrains Mono', monospace;
            color: #e2e8f0;
            background-color: rgba(15, 23, 42, 0.5);
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-size: 0.875em;
        }
        .prose pre code {
            background-color: transparent;
            padding: 0;
            color: #38bdf8; /* Sky blue for code blocks */
        }
        .prose p {
            margin-bottom: 0.5rem;
            line-height: 1.6;
        }
        .prose ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 0.5rem;
        }

        /* Typing Indicator */
        .typing-dot {
            width: 6px;
            height: 6px;
            background-color: #94a3b8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Hide sidebar on mobile by default */
        @media (max-width: 768px) {
            .sidebar-toggled {
                transform: translateX(-100%);
            }
        }
    </style>
</head>
<body class="bg-dark text-slate-200 h-screen w-full overflow-hidden flex selection:bg-primary selection:text-white">

    <!-- Mobile Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden glass" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-secondary flex-shrink-0 flex flex-col border-r border-slate-800 transition-transform duration-300 absolute md:relative z-30 h-full sidebar-toggled md:translate-x-0">
        <!-- Brand -->
        <div class="p-6 flex items-center gap-3 border-b border-slate-800/50">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary to-accent flex items-center justify-center shadow-lg shadow-primary/20">
                <i data-lucide="cpu" class="text-white w-5 h-5"></i>
            </div>
            <span class="font-bold text-lg tracking-tight text-white">Nexus<span class="text-primary">AI</span></span>
        </div>

        <!-- New Chat Button -->
        <div class="p-4">
            <button onclick="clearChat()" class="w-full bg-surface hover:bg-slate-700 text-slate-200 font-medium py-3 px-4 rounded-xl border border-slate-700 transition-all duration-200 flex items-center justify-center gap-2 group">
                <i data-lucide="plus" class="w-4 h-4 text-primary group-hover:text-accent transition-colors"></i>
                New Session
            </button>
        </div>

        <!-- History -->
        <div class="flex-1 overflow-y-auto px-4 py-2 space-y-2">
            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3 mt-2">Recent Chats</div>
            <!-- Mock History Items -->
            <button class="w-full text-left p-3 rounded-lg hover:bg-slate-800/50 text-sm text-slate-400 hover:text-slate-200 transition-colors flex items-center gap-3 group">
                <i data-lucide="message-square" class="w-4 h-4 text-slate-600 group-hover:text-primary"></i>
                <span class="truncate">API Integration Help</span>
            </button>
            <button class="w-full text-left p-3 rounded-lg hover:bg-slate-800/50 text-sm text-slate-400 hover:text-slate-200 transition-colors flex items-center gap-3 group">
                <i data-lucide="message-square" class="w-4 h-4 text-slate-600 group-hover:text-primary"></i>
                <span class="truncate">Python Async Logic</span>
            </button>
            <button class="w-full text-left p-3 rounded-lg hover:bg-slate-800/50 text-sm text-slate-400 hover:text-slate-200 transition-colors flex items-center gap-3 group">
                <i data-lucide="message-square" class="w-4 h-4 text-slate-600 group-hover:text-primary"></i>
                <span class="truncate">Database Schema</span>
            </button>
        </div>

        <!-- User Profile / Settings -->
        <div class="p-4 border-t border-slate-800/50">
            <button class="flex items-center gap-3 w-full p-2 rounded-lg hover:bg-slate-800 transition-colors">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-xs font-bold text-white">
                    DV
                </div>
                <div class="flex-1 text-left">
                    <div class="text-sm font-medium text-white">Developer</div>
                    <div class="text-xs text-slate-500">Pro Plan</div>
                </div>
                <i data-lucide="settings" class="w-4 h-4 text-slate-500"></i>
            </button>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col relative bg-dark">
        <!-- Header -->
        <header class="h-16 glass-header flex items-center justify-between px-6 z-10 sticky top-0">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white transition-colors">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <div class="flex flex-col">
                    <h1 class="font-semibold text-slate-100 flex items-center gap-2">
                        Technical Assistant 
                        <span class="px-2 py-0.5 rounded-full bg-primary/10 text-primary text-[10px] font-mono border border-primary/20">v2.4.0</span>
                    </h1>
                    <span class="text-xs text-slate-500 flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        Online & Ready
                    </span>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button class="p-2 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition-colors" title="Export Chat">
                    <i data-lucide="download" class="w-5 h-5"></i>
                </button>
                <button class="p-2 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition-colors" title="Clear Context">
                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <!-- Chat Container -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 scroll-smooth">
            
            <!-- Welcome Message -->
            <div class="flex flex-col items-center justify-center mt-10 mb-10 text-center animate-fade-in opacity-0" style="animation-delay: 0.1s; animation-fill-mode: forwards;">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700 flex items-center justify-center mb-4 shadow-xl">
                    <i data-lucide="terminal" class="w-8 h-8 text-primary"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">How can I help you code today?</h2>
                <p class="text-slate-400 max-w-md">I can assist with debugging, architecture, API integration, and system design. Paste a snippet or ask a question.</p>
            </div>

            <!-- Messages will be injected here via JS -->
            
        </div>

        <!-- Input Area -->
        <div class="p-4 md:p-6 bg-gradient-to-t from-dark to-transparent">
            <div class="max-w-4xl mx-auto relative group">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-primary to-accent rounded-xl opacity-20 group-hover:opacity-40 transition duration-500 blur"></div>
                <div class="relative flex items-end gap-2 bg-slate-900 rounded-xl border border-slate-700 p-2 shadow-2xl">
                    
                    <button class="p-3 text-slate-400 hover:text-white transition-colors rounded-lg hover:bg-slate-800 flex-shrink-0" title="Upload Code File">
                        <i data-lucide="paperclip" class="w-5 h-5"></i>
                    </button>

                    <textarea 
                        id="user-input" 
                        rows="1" 
                        class="w-full bg-transparent text-slate-200 placeholder-slate-500 text-sm focus:outline-none resize-none py-3 max-h-32 font-mono"
                        placeholder="Ask about your code..."
                        oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>

                    <button 
                        onclick="sendMessage()" 
                        id="send-btn"
                        class="p-3 bg-primary hover:bg-indigo-600 text-white rounded-lg transition-all duration-200 shadow-lg shadow-indigo-500/20 disabled:opacity-50 disabled:cursor-not-allowed flex-shrink-0">
                        <i data-lucide="send-horizontal" class="w-5 h-5"></i>
                    </button>
                </div>
                <div class="text-center mt-2">
                    <p class="text-[10px] text-slate-600">AI output can be inaccurate. Always verify code before production use.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Constants and Elements
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        // Toggle Sidebar for Mobile
        function toggleSidebar() {
            sidebar.classList.toggle('sidebar-toggled');
            sidebar.classList.toggle('-translate-x-full'); // Tailwind helper for mobile state logic
            overlay.classList.toggle('hidden');
        }

        // Auto-resize textarea on load
        userInput.style.height = 'auto';

        // Listen for Enter key
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Add Message to Chat
        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex gap-4 animate-slide-up ${sender === 'user' ? 'flex-row-reverse' : ''}`;
            
            // Avatar
            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-lg flex-shrink-0 flex items-center justify-center font-bold text-xs ${
                sender === 'user' 
                ? 'bg-gradient-to-tr from-emerald-500 to-teal-400 text-white' 
                : 'bg-gradient-to-br from-primary to-indigo-600 text-white shadow-lg shadow-indigo-500/20'
            }`;
            avatar.innerHTML = sender === 'user' ? 'DV' : '<i data-lucide="bot" class="w-4 h-4"></i>';

            // Bubble
            const bubble = document.createElement('div');
            bubble.className = `max-w-[85%] md:max-w-[75%] rounded-2xl p-4 shadow-sm text-sm leading-relaxed ${
                sender === 'user' 
                ? 'msg-user text-white rounded-tr-none' 
                : 'msg-bot text-slate-300 rounded-tl-none prose prose-invert max-w-none'
            }`;
            
            // Parse Markdown for Bot, Plain text for User
            if (sender === 'bot') {
                bubble.innerHTML = marked.parse(text);
            } else {
                bubble.textContent = text;
            }

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(bubble);
            chatContainer.appendChild(messageDiv);
            
            // Refresh icons in new content
            if (sender === 'bot') lucide.createIcons();

            // Scroll to bottom
            scrollToBottom();
        }

        // Loading Indicator
        function showLoading() {
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'loading-indicator';
            loadingDiv.className = 'flex gap-4 animate-fade-in';
            loadingDiv.innerHTML = `
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary to-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <i data-lucide="bot" class="w-4 h-4 text-white"></i>
                </div>
                <div class="msg-bot rounded-2xl rounded-tl-none p-4 flex items-center gap-2 border border-slate-700">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatContainer.appendChild(loadingDiv);
            lucide.createIcons();
            scrollToBottom();
        }

        function removeLoading() {
            const loadingDiv = document.getElementById('loading-indicator');
            if (loadingDiv) loadingDiv.remove();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Main Send Function
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Add User Message
            appendMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';
            userInput.focus();

            // 2. Show Loading
            showLoading();

            // 3. Call API
            try {
                // Connects to the Vercel Serverless Function defined in api/chat.js
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }

                const data = await response.json();
                
                removeLoading();
                
                // Handles the response format from the backend ({ answer: ... } or { error: ... })
                if (data.error) {
                     appendMessage(`**Error:** ${data.error}`, 'bot');
                } else {
                     appendMessage(data.answer, 'bot');
                }

            } catch (error) {
                removeLoading();
                appendMessage("**Error:** Could not connect to the backend. Please check your Vercel logs.", 'bot');
                console.error(error);
            }
        }

        function clearChat() {
            location.reload();
        }
    </script>
</body>
</html>
