<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Rounded Square Container -->
<rect width="512" height="512" rx="120" fill="black"/>

<!-- Defining the Glow Filter -->

<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%" filterUnits="objectBoundingBox">
<feGaussianBlur stdDeviation="15" result="blur" />
<feComposite in="SourceGraphic" in2="blur" operator="over" />
</filter>
</defs>

<!-- Central Intelligence Orb (Glowing) -->

<circle cx="256" cy="256" r="48" fill="white" filter="url(#glow)"/>
</svg>