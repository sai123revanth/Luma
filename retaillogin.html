<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Access | LUMA Intelligence Studio</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    
    <!-- Scripts & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #000000;
            --accent-1: #3b82f6; 
            --accent-2: #8b5cf6; 
            --accent-3: #ec4899; 
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.12);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: #ffffff;
            overflow-x: hidden;
            letter-spacing: -0.01em;
            margin: 0;
            width: 100%;
            min-height: 100vh;
        }

        .bg-fixed-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background: var(--bg);
        }

        .grid-bg {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black, transparent 80%);
        }

        .aura {
            position: absolute;
            width: 80vw;
            height: 80vw;
            max-width: 700px;
            max-height: 700px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25; 
            pointer-events: none;
            will-change: transform;
            animation: pulse-aura 15s infinite alternate ease-in-out;
        }
        .aura-1 { background: var(--accent-1); top: -15%; left: -15%; }
        .aura-2 { background: var(--accent-2); bottom: -15%; right: -15%; animation-delay: -5s; }

        @keyframes pulse-aura {
            0% { transform: scale(1) translate(0, 0); opacity: 0.2; }
            100% { transform: scale(1.1) translate(30px, 30px); opacity: 0.3; }
        }

        .glass-panel {
            background: rgba(15, 15, 15, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
        }

        .border-beam {
            position: relative;
            z-index: 1;
        }
        
        .border-beam::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1.5px;
            background: conic-gradient(from 0deg, transparent 60%, var(--accent-1), var(--accent-2), var(--accent-3), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            animation: spin-beam 6s linear infinite;
            pointer-events: none;
        }

        @keyframes spin-beam {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .input-focus-glow:focus-within {
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.6);
            background: rgba(255, 255, 255, 0.06);
        }

        .gradient-brand {
            background: linear-gradient(to right, #ffffff, #3b82f6, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        #auth-error {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 0.75rem;
            border-radius: 1rem;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.1em;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        /* Loading state for the button */
        .btn-loading {
            pointer-events: none;
            opacity: 0.7;
            position: relative;
            color: transparent !important;
        }
        .btn-loading::after {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            left: 50%;
            margin-top: -8px;
            margin-left: -8px;
            border: 2px solid black;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="bg-fixed-container">
        <div class="grid-bg"></div>
        <div class="aura aura-1"></div>
        <div class="aura aura-2"></div>
    </div>

    <div class="relative z-10 min-h-screen flex flex-col">
        <!-- Header -->
        <header class="p-6 md:p-8 flex justify-between items-center max-w-7xl mx-auto w-full">
            <a href="#" class="flex items-center gap-3 group">
                <div class="w-8 h-8 border-beam rounded-lg glass-panel flex items-center justify-center">
                    <div class="w-2.5 h-2.5 bg-white rounded-full shadow-[0_0_8px_#fff]"></div>
                </div>
                <span class="text-sm font-bold tracking-tighter uppercase">Luma</span>
            </a>
            <a href="/" class="text-[10px] font-bold uppercase tracking-widest text-slate-500 hover:text-white transition-colors flex items-center gap-2 group">
                <i data-lucide="arrow-left" class="w-3 h-3 group-hover:-translate-x-1 transition-transform"></i> Exit Portal
            </a>
        </header>

        <!-- Main Content -->
        <main class="flex-1 flex items-center justify-center px-6 py-8 md:py-12">
            <div class="reveal max-w-md w-full active">
                <div class="text-center mb-8 md:mb-10">
                    <span class="text-blue-400 font-bold text-[10px] tracking-[0.4em] uppercase block mb-4">// AUTHENTICATION</span>
                    <h1 class="text-3xl md:text-5xl font-black tracking-tighter uppercase mb-2">Access <span class="gradient-brand">Portal</span></h1>
                    <p class="text-slate-400 text-xs md:text-sm">Identify yourself to enter the studio.</p>
                </div>

                <div class="glass-panel border-beam p-8 md:p-12 rounded-[2.5rem] shadow-[0_30px_60px_rgba(0,0,0,0.6)] relative overflow-hidden">
                    <div class="absolute -top-32 -right-32 w-64 h-64 bg-blue-500/10 blur-[80px]"></div>
                    <div class="absolute -bottom-32 -left-32 w-64 h-64 bg-purple-500/10 blur-[80px]"></div>

                    <div id="auth-error">Authentication failed. Please check your credentials.</div>

                    <form id="login-form" class="space-y-6 relative z-10">
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500 ml-1">Identity (Email)</label>
                            <div class="glass-panel rounded-2xl flex items-center px-4 transition-all input-focus-glow border-white/5">
                                <i data-lucide="mail" class="w-4 h-4 text-slate-500 mr-3"></i>
                                <input type="email" id="email-input" autocomplete="email" required placeholder="name@domain.com" class="bg-transparent w-full py-4 text-sm focus:outline-none text-white placeholder:text-slate-700">
                            </div>
                        </div>

                        <div class="space-y-2">
                            <div class="flex justify-between items-center ml-1">
                                <label class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500">Security Key</label>
                                <button type="button" id="forgot-password" class="text-[9px] font-bold uppercase tracking-widest text-blue-400 hover:text-white transition-colors">Lost Access?</button>
                            </div>
                            <div class="glass-panel rounded-2xl flex items-center px-4 transition-all input-focus-glow border-white/5">
                                <i data-lucide="lock" class="w-4 h-4 text-slate-500 mr-3"></i>
                                <input type="password" id="password-input" autocomplete="current-password" required placeholder="••••••••" class="bg-transparent w-full py-4 text-sm focus:outline-none text-white placeholder:text-slate-700">
                                <button type="button" onclick="togglePasswordVisibility()" class="p-1 hover:text-blue-400 transition-colors opacity-50 hover:opacity-100">
                                    <i data-lucide="eye" id="password-eye" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                        <div class="pt-4">
                            <button type="submit" id="email-login-btn" class="w-full py-4 bg-white text-black font-bold text-[11px] uppercase tracking-[0.25em] rounded-2xl hover:scale-[1.02] active:scale-[0.98] transition-all shadow-[0_0_30px_rgba(255,255,255,0.2)]">
                                Initialize Session
                            </button>
                        </div>
                    </form>
                </div>

                <p class="text-center mt-8 text-slate-600 text-[10px] font-medium uppercase tracking-[0.1em]">
                    New Architect? <a href="#" class="text-purple-400 font-bold hover:text-purple-300 transition-colors underline decoration-purple-500/30">Request Deployment</a>
                </p>
            </div>
        </main>

        <footer class="p-8 text-center mt-auto">
            <p class="text-slate-700 text-[8px] md:text-[9px] uppercase tracking-[0.5em] font-semibold">LUMA Intelligence Studio // Secure Infrastructure Tier 4</p>
        </footer>
    </div>

    <!-- Firebase SDK Implementation -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Your specific Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAq7kgiAb2LCd5lMLGUVij8z8dWJWXKRHE",
            authDomain: "retailposlogin.firebaseapp.com",
            projectId: "retailposlogin",
            storageBucket: "retailposlogin.firebasestorage.app",
            messagingSenderId: "369042230414",
            appId: "1:369042230414:web:86dfe7a74778393ae5cddf",
            measurementId: "G-N4VTKM8SEK"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('login-form');
        const emailBtn = document.getElementById('email-login-btn');
        const errorMsg = document.getElementById('auth-error');
        const emailInput = document.getElementById('email-input');
        const passwordInput = document.getElementById('password-input');
        const forgotBtn = document.getElementById('forgot-password');

        // Check for existing session
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("Authenticated as:", user.email);
                // Redirect if already logged in and visiting this page
                // window.location.href = 'samplepos.html'; 
            }
        });

        // Handle Login Submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI Feedback
            errorMsg.style.display = 'none';
            emailBtn.classList.add('btn-loading');

            const email = emailInput.value;
            const password = passwordInput.value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Show success status before redirect
                emailBtn.textContent = "ACCESS GRANTED";
                emailBtn.style.backgroundColor = "#4ade80"; // Green
                
                setTimeout(() => {
                    window.location.href = 'samplepos.html'; 
                }, 800);

            } catch (error) {
                console.error("Firebase Auth Error:", error.code);
                emailBtn.classList.remove('btn-loading');
                
                errorMsg.style.display = 'block';
                
                // Friendly error messages
                switch(error.code) {
                    case 'auth/invalid-credential':
                        errorMsg.textContent = "ACCESS DENIED: Credentials mismatch.";
                        break;
                    case 'auth/user-not-found':
                        errorMsg.textContent = "ACCESS DENIED: Unknown Architect Identity.";
                        break;
                    case 'auth/wrong-password':
                        errorMsg.textContent = "ACCESS DENIED: Invalid Security Key.";
                        break;
                    case 'auth/too-many-requests':
                        errorMsg.textContent = "SECURITY ALERT: Account locked temporarily.";
                        break;
                    default:
                        errorMsg.textContent = "SYSTEM ERROR: Authentication link failed.";
                }
            }
        });

        // Handle Password Reset
        forgotBtn.addEventListener('click', async () => {
            const email = emailInput.value;
            if (!email) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = "Input Identity (Email) to reset key.";
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                errorMsg.style.display = 'block';
                errorMsg.style.backgroundColor = "rgba(59, 130, 246, 0.1)";
                errorMsg.style.borderColor = "rgba(59, 130, 246, 0.2)";
                errorMsg.style.color = "#60a5fa";
                errorMsg.textContent = "Recovery link deployed to your inbox.";
            } catch (error) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = "Failed to deploy recovery link.";
            }
        });
    </script>

    <script>
        // UI Interactions
        lucide.createIcons();

        function togglePasswordVisibility() {
            const input = document.getElementById('password-input');
            const icon = document.getElementById('password-eye');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // Entrance animation
        window.addEventListener('load', () => {
            document.querySelectorAll('.reveal').forEach(el => el.classList.add('active'));
        });

        // Interactive Auras
        const auras = document.querySelectorAll('.aura');
        let mouseX = 0, mouseY = 0;
        let auraX = 0, auraY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 60;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 60;
        });

        function animateAuras() {
            auraX += (mouseX - auraX) * 0.05;
            auraY += (mouseY - auraY) * 0.05;
            
            auras.forEach((aura, index) => {
                const speed = (index + 1) * 0.5;
                aura.style.transform = `translate(${auraX * speed}px, ${auraY * speed}px)`;
            });
            requestAnimationFrame(animateAuras);
        }
        animateAuras();
    </script>
</body>
</html>
