<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Access | LUMA Intelligence Studio</title>
    
        <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #000000;
            --accent-1: #3b82f6; 
            --accent-2: #8b5cf6; 
            --accent-3: #ec4899; 
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: #ffffff;
            overflow-x: hidden;
            letter-spacing: -0.01em;
            margin: 0;
            width: 100%;
        }

        /* Fixed Background System */
        .bg-fixed-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background: var(--bg);
        }

        .grid-bg {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(ellipse at center, black, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black, transparent 80%);
        }

        .aura {
            position: absolute;
            width: 90vw;
            height: 90vw;
            max-width: 800px;
            max-height: 800px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.2; 
            pointer-events: none;
            will-change: transform;
            animation: aura-move 20s infinite alternate ease-in-out;
        }
        .aura-1 { background: var(--accent-1); top: -10%; left: -15%; }
        .aura-2 { background: var(--accent-3); bottom: -10%; right: -10%; animation-delay: -7s; }

        @keyframes aura-move {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.05); }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
        }

        .border-beam {
            position: relative;
            z-index: 1;
        }
        
        .border-beam::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: conic-gradient(from 0deg, transparent 50%, var(--accent-1), var(--accent-2), var(--accent-3), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            animation: spin-beam 4s linear infinite;
            pointer-events: none;
        }

        @keyframes spin-beam {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .gradient-brand {
            background: linear-gradient(to right, #ffffff, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        input {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus {
            outline: none;
            border-color: var(--accent-1) !important;
            background: rgba(255, 255, 255, 0.08) !important;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.1);
        }

        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <div class="bg-fixed-container">
        <div class="grid-bg"></div>
        <div class="aura aura-1"></div>
        <div class="aura aura-2"></div>
    </div>

    <!-- Minimal Header -->
    <header class="fixed top-0 w-full z-[100] px-4 md:px-6 py-6">
        <div class="max-w-7xl mx-auto flex justify-center lg:justify-start items-center relative">
            <a href="index.html" class="flex items-center gap-3 group cursor-pointer">
                <div class="w-10 h-10 border-beam rounded-xl glass-panel flex items-center justify-center">
                    <div class="w-3 h-3 bg-white rounded-full shadow-[0_0_10px_#fff]"></div>
                </div>
                <span class="text-xl font-bold tracking-tighter uppercase">Luma</span>
            </a>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center px-4 pt-20 pb-12 relative z-10">
        <div class="reveal w-full max-w-md text-center mb-8">
            <span class="text-blue-400 font-bold text-[9px] tracking-[0.4em] uppercase block mb-4">// NEURAL AUTHENTICATION</span>
            <h1 class="text-3xl md:text-5xl font-black tracking-tighter uppercase mb-2">SECURE <span class="gradient-brand">LOGIN</span></h1>
            <p class="text-slate-500 text-xs uppercase tracking-widest font-bold">Access your Retail Intelligence Dashboard</p>
        </div>

        <div class="reveal w-full max-w-md">
            <div class="glass-panel border-beam p-8 md:p-10 rounded-[2.5rem] shadow-2xl">
                <form id="login-form" class="space-y-6">
                    <!-- User ID -->
                    <div class="space-y-2">
                        <label class="text-[9px] font-bold uppercase tracking-[0.2em] text-slate-500 pl-2">User Identifier</label>
                        <div class="relative">
                            <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                            <input type="text" id="userid" required placeholder="Enter User ID" 
                                   class="w-full pl-11 pr-4 py-4 rounded-2xl text-sm placeholder:text-slate-700">
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="space-y-2">
                        <label class="text-[9px] font-bold uppercase tracking-[0.2em] text-slate-500 pl-2">Access Key</label>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                            <input type="password" id="password" required placeholder="••••••••" 
                                   class="w-full pl-11 pr-12 py-4 rounded-2xl text-sm placeholder:text-slate-700">
                            <button type="button" id="toggle-password" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white transition-colors">
                                <i data-lucide="eye" class="w-4 h-4" id="eye-icon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Auth Actions -->
                    <div class="flex items-center justify-between px-2">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <div class="w-4 h-4 rounded border border-white/10 glass-panel flex items-center justify-center group-hover:border-blue-400 transition-colors">
                                <div id="remember-check" class="hidden w-2 h-2 bg-blue-400 rounded-[2px]"></div>
                            </div>
                            <input type="checkbox" id="remember" class="hidden">
                            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Remember Node</span>
                        </label>
                        <a href="#" class="text-[10px] font-bold text-blue-400 uppercase tracking-widest hover:text-white transition-colors">Forgot Key?</a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="w-full py-4 bg-white text-black font-black uppercase text-xs tracking-[0.2em] rounded-2xl hover:bg-blue-400 hover:text-white transition-all active:scale-[0.98] shadow-[0_0_30px_rgba(255,255,255,0.1)] flex items-center justify-center gap-2">
                        Initiate Session
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </form>

                <div class="mt-8 pt-8 border-t border-white/5 text-center">
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4">New to LUMA Studio?</p>
                    <a href="retailpos.html" class="inline-block px-6 py-2 glass-panel rounded-full text-[9px] font-bold text-white uppercase tracking-widest hover:bg-white hover:text-black transition-all">
                        Explore our plans
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-8 px-4 border-t border-white/5 relative z-10">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 text-[9px] font-bold uppercase tracking-widest text-slate-600">
            <div class="flex items-center gap-4">
                <span>Intelligence Studio &copy; 2025</span>
                <span class="hidden md:inline text-white/10">|</span>
                <span>SECURED BY LUMA NEURAL GUARD</span>
            </div>
            <div class="flex gap-6">
                <span>Privacy Protocol</span>
                <span>Encryption Standards</span>
            </div>
        </div>
    </footer>

    <script>
        lucide.createIcons();

        // Reveal Animation
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.05 });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        // Password Toggle
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('toggle-password');
        const eyeIcon = document.getElementById('eye-icon');
        let isVisible = false;

        toggleBtn.addEventListener('click', () => {
            isVisible = !isVisible;
            passwordInput.type = isVisible ? 'text' : 'password';
            eyeIcon.setAttribute('data-lucide', isVisible ? 'eye-off' : 'eye');
            lucide.createIcons();
        });

        // Custom Checkbox
        const rememberCheck = document.getElementById('remember-check');
        const rememberInput = document.getElementById('remember');
        rememberInput.addEventListener('change', () => {
            rememberCheck.classList.toggle('hidden', !rememberInput.checked);
        });

        // Form Submit
        const form = document.getElementById('login-form');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = form.querySelector('button[type="submit"]');
            btn.innerHTML = 'Verifying Credentials...';
            btn.classList.add('opacity-50', 'pointer-events-none');
            
            // Mock auth delay
            setTimeout(() => {
                btn.innerHTML = 'Session Established';
                btn.classList.replace('bg-white', 'bg-green-500');
                btn.classList.remove('opacity-50');
            }, 1500);
        });

        // Parallax Auras
        window.addEventListener('mousemove', (e) => {
            if (window.innerWidth < 768) return;
            const x = (e.clientX / window.innerWidth - 0.5) * 40;
            const y = (e.clientY / window.innerHeight - 0.5) * 40;
            document.querySelectorAll('.aura').forEach((aura, i) => {
                const speed = (i + 1) * 0.2;
                aura.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
    </script>
</body>
</html>
